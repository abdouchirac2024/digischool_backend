openapi: 3.0.3
info:
  title: DigiSchool API
  description: |
    API REST pour la gestion d'ecoles DigiSchool.

    ## Authentification
    La plupart des endpoints necessitent un token JWT.
    1. Utilisez `POST /api/auth/login` pour obtenir un token
    2. Ajoutez le header `Authorization: Bearer <token>` a vos requetes

    ## Multi-tenancy
    Le systeme est multi-tenant base sur l'ecole (ecoleId).
    L'ecoleId est automatiquement extrait du token JWT.
    Les utilisateurs ne peuvent acceder qu'aux ressources de leur ecole.

    ## Comptes de test
    | Role | Email | Telephone | Password |
    |------|-------|-----------|----------|
    | Admin | admin@digischool.cm | 699000001 | admin123 |
    | Directeur | directeur@lycee-leclerc.cm | 699000002 | directeur123 |
    | Enseignant | enseignant@lycee-leclerc.cm | 699000003 | enseignant123 |
    | Secretaire | secretaire@lycee-leclerc.cm | 699000004 | secretaire123 |
    | Parent | parent@gmail.com | 699000005 | parent123 |
    | Eleve | eleve@lycee-leclerc.cm | 699000006 | eleve123 |
  version: 1.0.0
  contact:
    name: DigiSchool Support
    email: support@digischool.cm
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api
    description: Serveur de developpement local
  - url: https://api.digischool.cm/api
    description: Serveur de production

tags:
  - name: Authentication
    description: Connexion, deconnexion et gestion des tokens
  - name: Roles
    description: Gestion des roles utilisateurs
  - name: Regions
    description: Gestion des regions geographiques
  - name: Classes
    description: Gestion des classes scolaires (multi-tenant)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenu via /auth/login

  schemas:
    # ==================== AUTH ====================
    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email ou numero de telephone
          example: admin@digischool.cm
        password:
          type: string
          format: password
          description: Mot de passe
          example: admin123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT d'acces
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Token de rafraichissement
        expiresIn:
          type: integer
          format: int64
          description: Duree de validite en millisecondes
          example: 86400000
        user:
          $ref: '#/components/schemas/UserDto'
        message:
          type: string
          example: Connexion reussie
        success:
          type: boolean
          example: true

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Token de rafraichissement

    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nom:
          type: string
          example: Admin
        prenom:
          type: string
          example: Super
        email:
          type: string
          format: email
          example: admin@digischool.cm
        telephone:
          type: string
          example: "699000001"
        statut:
          type: string
          enum: [EN_ATTENTE, ACTIF, INACTIF]
          description: Statut du compte utilisateur
          example: ACTIF
        derniereConnexion:
          type: string
          format: date-time
          description: Date et heure de la derniere connexion
          example: "2024-01-15T10:30:00"
        roleId:
          type: integer
          format: int64
          example: 1
        roleName:
          type: string
          enum: [ADMIN, DIRECTEUR, ENSEIGNANT, SECRETAIRE, PARENT, ELEVE]
          example: ADMIN
        ecoleId:
          type: integer
          format: int64
          nullable: true
          description: ID de l'ecole (null pour admin SaaS)
          example: 1
        ecoleNom:
          type: string
          nullable: true
          description: Nom de l'ecole
          example: Lycee Leclerc

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation reussie
        success:
          type: boolean
          example: true

    # ==================== ROLES ====================
    RoleDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          enum: [ADMIN, DIRECTEUR, ENSEIGNANT, SECRETAIRE, PARENT, ELEVE]
          example: DIRECTEUR

    # ==================== REGIONS ====================
    RegionDto:
      type: object
      required:
        - code
        - nom
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        code:
          type: string
          maxLength: 10
          description: Code unique de la region
          example: CE
        nom:
          type: string
          maxLength: 100
          description: Nom de la region
          example: Centre

    # ==================== CLASSES ====================
    ClasseDto:
      type: object
      required:
        - nomClasse
        - niveau
        - sousSysteme
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nomClasse:
          type: string
          maxLength: 100
          description: Nom de la classe
          example: 6eme A
        niveau:
          type: string
          enum: [MATERNELLE, PRIMAIRE, COLLEGE, LYCEE, NURSERY, PRIMARY, SECONDARY, HIGH_SCHOOL]
          description: Niveau scolaire
          example: COLLEGE
        sousSysteme:
          type: string
          enum: [FRANCOPHONE, ANGLOPHONE, BILINGUE]
          description: Sous-systeme educatif
          example: FRANCOPHONE
        section:
          type: string
          maxLength: 10
          description: Section de la classe (A, B, C, etc.)
          example: A
        capacite:
          type: integer
          minimum: 1
          maximum: 100
          description: Capacite maximale de la classe
          example: 50
        statut:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVEE]
          default: ACTIVE
          description: Statut de la classe
          example: ACTIVE
        effectifActuel:
          type: integer
          readOnly: true
          description: Nombre actuel d'eleves inscrits
          example: 45
        fraisScolarite:
          type: number
          format: double
          minimum: 0
          description: Frais de scolarite en FCFA
          example: 150000.0
        description:
          type: string
          maxLength: 500
          description: Description de la classe
          example: Classe de 6eme section A
        ecoleId:
          type: integer
          format: int64
          readOnly: true
          description: ID de l'ecole (auto-defini depuis JWT)
          example: 1
        ecoleNom:
          type: string
          readOnly: true
          description: Nom de l'ecole
          example: Lycee Leclerc
        anneeScolaireId:
          type: integer
          format: int64
          description: ID de l'annee scolaire
          example: 1
        anneeScolaireLibelle:
          type: string
          readOnly: true
          description: Libelle de l'annee scolaire
          example: "2023-2024"
        titulaireId:
          type: integer
          format: int64
          description: ID de l'enseignant titulaire
          example: 3
        titulaireNom:
          type: string
          readOnly: true
          description: Nom complet du titulaire
          example: Jean Enseignant

    # ==================== ERRORS ====================
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    UnauthorizedError:
      description: Token JWT manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-01-15T10:30:00"
            status: 401
            error: Unauthorized
            message: Token JWT invalide ou expire
            path: /api/auth/me

    ForbiddenError:
      description: Acces refuse - permissions insuffisantes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-01-15T10:30:00"
            status: 403
            error: Forbidden
            message: Vous n'avez pas acces a cette ressource
            path: /api/classes/1

    NotFoundError:
      description: Ressource non trouvee
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2024-01-15T10:30:00"
            status: 404
            error: Not Found
            message: Classe non trouvee
            path: /api/classes/999

security:
  - bearerAuth: []

paths:
  # ==================== AUTHENTICATION ====================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Connexion utilisateur
      description: |
        Authentifie un utilisateur avec son email OU telephone et mot de passe.
        Retourne un token JWT a utiliser pour les requetes authentifiees.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              emailLogin:
                summary: Connexion avec email
                value:
                  identifier: admin@digischool.cm
                  password: admin123
              phoneLogin:
                summary: Connexion avec telephone
                value:
                  identifier: "699000002"
                  password: directeur123
      responses:
        '200':
          description: Connexion reussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants incorrects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2024-01-15T10:30:00"
                status: 401
                error: Unauthorized
                message: Email/telephone ou mot de passe incorrect
                path: /api/auth/login
        '403':
          description: Compte inactif ou en attente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2024-01-15T10:30:00"
                status: 403
                error: Forbidden
                message: Votre compte est en attente de validation
                path: /api/auth/login

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Profil utilisateur connecte
      description: Retourne les informations de l'utilisateur actuellement connecte
      operationId: getCurrentUser
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rafraichir le token
      description: Obtient un nouveau token d'acces en utilisant le refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rafraichi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token invalide ou expire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Deconnexion
      description: Deconnecte l'utilisateur et invalide le token
      operationId: logout
      responses:
        '200':
          description: Deconnexion reussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==================== ROLES ====================
  /roles:
    get:
      tags:
        - Roles
      summary: Liste des roles
      description: Retourne la liste de tous les roles disponibles dans le systeme
      operationId: getAllRoles
      responses:
        '200':
          description: Liste des roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDto'
              example:
                - id: 1
                  name: ADMIN
                - id: 2
                  name: DIRECTEUR
                - id: 3
                  name: ENSEIGNANT
                - id: 4
                  name: SECRETAIRE
                - id: 5
                  name: PARENT
                - id: 6
                  name: ELEVE
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==================== REGIONS ====================
  /regions:
    get:
      tags:
        - Regions
      summary: Liste des regions
      description: Retourne la liste de toutes les regions
      operationId: getAllRegions
      responses:
        '200':
          description: Liste des regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegionDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Regions
      summary: Creer une region
      description: Cree une nouvelle region
      operationId: createRegion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionDto'
            example:
              code: "NO"
              nom: "Nord"
      responses:
        '200':
          description: Region creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /regions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la region
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Regions
      summary: Obtenir une region
      description: Retourne une region par son ID
      operationId: getRegionById
      responses:
        '200':
          description: Region trouvee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Regions
      summary: Modifier une region
      description: Met a jour une region existante
      operationId: updateRegion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionDto'
      responses:
        '200':
          description: Region modifiee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Regions
      summary: Supprimer une region
      description: Supprime une region
      operationId: deleteRegion
      responses:
        '204':
          description: Region supprimee
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==================== CLASSES ====================
  /classes:
    get:
      tags:
        - Classes
      summary: Liste des classes
      description: |
        Retourne la liste des classes de l'ecole de l'utilisateur connecte.

        **Multi-tenancy:** L'ecole est automatiquement determinee depuis le token JWT.
      operationId: getAllClasses
      responses:
        '200':
          description: Liste des classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClasseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Classes
      summary: Creer une classe
      description: |
        Cree une nouvelle classe dans l'ecole de l'utilisateur connecte.

        **Note:** L'ecoleId est automatiquement defini depuis le token JWT.
      operationId: createClasse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseDto'
            example:
              nomClasse: "Terminale C"
              niveau: "LYCEE"
              sousSysteme: "FRANCOPHONE"
              section: "C"
              capacite: 45
              statut: "ACTIVE"
              fraisScolarite: 200000.0
              description: "Classe de Terminale scientifique"
              anneeScolaireId: 1
              titulaireId: 3
      responses:
        '200':
          description: Classe creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /classes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la classe
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Classes
      summary: Obtenir une classe
      description: |
        Retourne une classe par son ID.

        **Autorisation:** Verifie que la classe appartient a l'ecole de l'utilisateur.
      operationId: getClasseById
      responses:
        '200':
          description: Classe trouvee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Classes
      summary: Modifier une classe
      description: |
        Met a jour une classe existante.

        **Autorisation:** Verifie que la classe appartient a l'ecole de l'utilisateur.
      operationId: updateClasse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseDto'
      responses:
        '200':
          description: Classe modifiee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Classes
      summary: Supprimer une classe
      description: |
        Supprime une classe.

        **Autorisation:** Verifie que la classe appartient a l'ecole de l'utilisateur.
      operationId: deleteClasse
      responses:
        '204':
          description: Classe supprimee
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /classes/ecole/{ecoleId}:
    parameters:
      - name: ecoleId
        in: path
        required: true
        description: ID de l'ecole
        schema:
          type: integer
          format: int64

    get:
      tags:
        - Classes
      summary: Classes par ecole
      description: |
        Retourne toutes les classes d'une ecole specifique.

        **Autorisation:** Verifie que l'utilisateur a acces a cette ecole.
      operationId: getClassesByEcole
      responses:
        '200':
          description: Liste des classes de l'ecole
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClasseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
