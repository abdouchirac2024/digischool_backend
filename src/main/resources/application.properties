# -------------------------
# Nom de l'application
# -------------------------
spring.application.name=digiSchool

# -------------------------
# Multitenancy
# -------------------------
app.tenant.header=X-Tenant-ID
# spring.session.store-type=jdbc  # d�sactiv� pour l'instant

# -------------------------
# Base de données PostgreSQL (Render)
# -------------------------
spring.datasource.url=jdbc:${DB_URL:postgresql://localhost:5432/digischool}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Evite l'erreur "Unable to determine Dialect"
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# SÉCURITÉ: Désactiver en production (expose les requêtes SQL)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false} 
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

# -------------------------
# Serveur
# -------------------------
server.port=8080

# -------------------------
# Encodage (optionnel mais conseille)
# -------------------------
spring.datasource.connection-charset=UTF-8
spring.datasource.characterEncoding=UTF-8

# -------------------------
# JWT Configuration
# -------------------------
# SECURITE CRITIQUE: Le secret DOIT etre defini via variable d'environnement
# Generer un secret fort: openssl rand -base64 64
# L'app refuse de demarrer si JWT_SECRET n'est pas defini
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-HelpDigiSchool2025}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------
# Cookie Configuration (HttpOnly JWT)
# -------------------------
# Secure=false en dev (HTTP localhost), Secure=true en prod (HTTPS)
app.cookie.secure=false
# Durée de vie du ws-token en millisecondes (5 minutes)
app.cookie.ws-token-expiration=300000

# -------------------------
# SpringDoc OpenAPI / Swagger
# -------------------------
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# OpenAPI YAML: http://localhost:8080/v3/api-docs.yaml
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.deepLinking=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai
springdoc.swagger-ui.custom-css-url=/swagger-ui/custom.css
springdoc.show-actuator=false

# -------------------------
# Redis Configuration
# -------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# -------------------------
# File Upload Configuration
# -------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# -------------------------
# MinIO - Stockage Objet S3-compatible
# -------------------------
# Endpoint MinIO (local dev: http://localhost:9000, Docker: http://minio:9000)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.avatars=${MINIO_BUCKET_AVATARS:avatars}
minio.bucket.documents=${MINIO_BUCKET_DOCUMENTS:documents}
# URL publique utilisée dans les réponses API (ex: http://api.school.com/files ou http://minio:9000)
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# -------------------------
# Scheduling (for presence cleanup)
# -------------------------
spring.task.scheduling.enabled=true

# -------------------------
# MongoDB (GridFS pour fichiers - désactivé repositories JPA, connexion lazy)
# -------------------------
spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/digischool}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.repositories.type=none

# -------------------------
# HikariCP - Pool de connexions
# -------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DigiSchoolHikariCP
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------
# Tomcat Thread Pool
# -------------------------
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# -------------------------
# Actuator (Healthcheck + Prometheus)
# -------------------------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}