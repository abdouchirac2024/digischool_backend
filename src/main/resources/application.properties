# -------------------------
# Nom de l'application
# -------------------------
spring.application.name=digiSchool

# -------------------------
# Multitenancy
# -------------------------
app.tenant.header=X-Tenant-ID
# spring.session.store-type=jdbc  # désactivé pour l'instant

# -------------------------
# Base de données MySQL locale
# -------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=update    
spring.jpa.show-sql=true              
spring.jpa.properties.hibernate.format_sql=true  

# -------------------------
# Serveur
# -------------------------
server.port=8080

# -------------------------
# Encodage (optionnel mais conseillé)
# -------------------------
spring.datasource.connection-charset=UTF-8
spring.datasource.characterEncoding=UTF-8
