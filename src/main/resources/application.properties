# -------------------------
# Nom de l'application
# -------------------------
spring.application.name=digiSchool

# -------------------------
# Multitenancy
# -------------------------
app.tenant.header=X-Tenant-ID
# spring.session.store-type=jdbc  # d�sactiv� pour l'instant

# -------------------------
# Base de données MySQL locale
# -------------------------
# SÉCURITÉ: Utiliser variables d'environnement en production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# SÉCURITÉ: Désactiver en production (expose les requêtes SQL)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}  

# -------------------------
# Serveur
# -------------------------
server.port=8080

# -------------------------
# Encodage (optionnel mais conseille)
# -------------------------
spring.datasource.connection-charset=UTF-8
spring.datasource.characterEncoding=UTF-8

# -------------------------
# JWT Configuration
# -------------------------
# SÉCURITÉ CRITIQUE: Le secret DOIT être défini via variable d'environnement en production
# Générer un secret fort: openssl rand -base64 64
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-HelpDigiSchool2025}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------
# SpringDoc OpenAPI / Swagger
# -------------------------
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# OpenAPI YAML: http://localhost:8080/v3/api-docs.yaml
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false

# -------------------------
# Redis Configuration
# -------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
