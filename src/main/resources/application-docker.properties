spring.application.name=digiSchool

# Multitenancy: JWT token uniquement (sécurisé)

# \u26D4 D�sactiver Spring Session JDBC pour l\u2019instant
# spring.session.store-type=jdbc


# spring.session.store-type=jdbc  \u274C d�sactiv�

spring.datasource.url=jdbc:mysql://mysql-db:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Actuator endpoints
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=digischool-backend

# -------------------------
# JWT Configuration
# -------------------------
jwt.secret=${JWT_SECRET:HelpDigiSchool2025SecretKeyForJWTTokenGeneration256Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

