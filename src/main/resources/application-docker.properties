spring.application.name=digiSchool

# -------------------------
# Base de données MySQL (Railway - env vars ou fallback Docker Compose)
# -------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-db:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

server.port=8080

# -------------------------
# HikariCP - Pool de connexions
# Taille adaptée pour chaque instance (3 instances × 20 = 60 connexions max)
# -------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DigiSchoolHikariCP
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------
# Tomcat Thread Pool
# -------------------------
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# -------------------------
# JWT
# -------------------------
jwt.secret=${JWT_SECRET:HelpDigiSchool2025SecretKeyForJWTTokenGeneration256Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# -------------------------
# Cookie Configuration (HttpOnly JWT)
# -------------------------
# Secure=true en production (HTTPS via Traefik)
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.ws-token-expiration=300000

# -------------------------
# Redis
# -------------------------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# -------------------------
# File Upload
# -------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# -------------------------
# MinIO - Stockage objet centralisé (compatible multi-instances)
# -------------------------
minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.avatars=${MINIO_BUCKET_AVATARS:avatars}
minio.bucket.documents=${MINIO_BUCKET_DOCUMENTS:documents}
# URL publique retournée dans les réponses API
# En dev: http://localhost:9000, en prod: https://files.helpdigischool.com
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# -------------------------
# Actuator (Healthcheck + Prometheus)
# -------------------------
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=digischool-backend

# -------------------------
# Multitenancy
# -------------------------
app.tenant.header=X-Tenant-ID

# -------------------------
# SpringDoc / Swagger
# -------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.deepLinking=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai
springdoc.swagger-ui.custom-css-url=/swagger-ui/custom.css
springdoc.show-actuator=false
