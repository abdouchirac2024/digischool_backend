global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'digischool-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    # DNS Round Robin docker permet de decouvrir toutes les instances 'backend'
    static_configs:
      - targets: ['backend:8080']
